name: Quality Checks

on:
  pull_request:
    branches: [main, staging, develop]
    types: [opened, synchronize, reopened]
  push:
    branches: [main, staging, develop]

env:
  NODE_VERSION: '18'

jobs:
  lint-and-format:
    name: Lint and Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check Prettier formatting
        run: npm run format:check

      - name: Run TypeScript check
        run: npm run type-check

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/lcov.info
          flags: unit-tests
          name: unit-tests-coverage

  component-tests:
    name: Component Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run component tests
        run: npm run test:components:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/lcov.info
          flags: component-tests
          name: component-tests-coverage

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: visa_assist_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup test database
        run: |
          # Setup test database migrations
          npm run db:reset
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/visa_assist_test

      - name: Run integration tests
        run: npm run test:integration:coverage
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/visa_assist_test
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/lcov.info
          flags: integration-tests
          name: integration-tests-coverage

  security-checks:
    name: Security Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=moderate

      - name: Check for known vulnerabilities
        run: |
          npx audit-ci --config audit-ci.json || true

      - name: Snyk Security Scan
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

  build-test:
    name: Build Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: 1
          # Use dummy values for build test
          NEXT_PUBLIC_SUPABASE_URL: https://dummy.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-key
          OPENAI_API_KEY: sk-dummy-key
          NEXTAUTH_SECRET: dummy-secret-for-build-test-only

      - name: Test build output
        run: |
          # Check if build output exists
          if [ ! -d ".next" ]; then
            echo "Build output directory not found"
            exit 1
          fi
          
          # Check for essential files
          if [ ! -f ".next/BUILD_ID" ]; then
            echo "Build ID file not found"
            exit 1
          fi
          
          echo "✅ Build test passed"

  dependency-check:
    name: Dependency Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Check for outdated dependencies
        run: |
          npm outdated || true
          echo "Checking for critical updates..."

      - name: Check package-lock.json
        run: |
          npm ci
          if git diff --exit-code package-lock.json; then
            echo "✅ package-lock.json is up to date"
          else
            echo "❌ package-lock.json is out of sync"
            exit 1
          fi

  accessibility-check:
    name: Accessibility Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_SUPABASE_URL: https://dummy.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-key
          OPENAI_API_KEY: sk-dummy-key
          NEXTAUTH_SECRET: dummy-secret-for-build-test-only

      - name: Start application
        run: |
          npm start &
          sleep 10
        env:
          PORT: 3000

      - name: Run accessibility tests
        run: |
          npx @axe-core/cli http://localhost:3000 --exit || true
          npx @axe-core/cli http://localhost:3000/login --exit || true

  performance-check:
    name: Performance Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_SUPABASE_URL: https://dummy.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-key
          OPENAI_API_KEY: sk-dummy-key
          NEXTAUTH_SECRET: dummy-secret-for-build-test-only

      - name: Analyze bundle size
        run: npm run analyze
        env:
          ANALYZE: true

      - name: Check bundle size
        run: |
          # Check if bundle size is within limits
          node -e "
            const fs = require('fs');
            const stats = JSON.parse(fs.readFileSync('.next/analyze/client.json'));
            const totalSize = stats.assets.reduce((acc, asset) => acc + asset.size, 0);
            const limitMB = 2; // 2MB limit
            const limitBytes = limitMB * 1024 * 1024;
            
            if (totalSize > limitBytes) {
              console.error(\`Bundle size \${(totalSize / 1024 / 1024).toFixed(2)}MB exceeds limit of \${limitMB}MB\`);
              process.exit(1);
            } else {
              console.log(\`✅ Bundle size \${(totalSize / 1024 / 1024).toFixed(2)}MB is within limit\`);
            }
          " || true

  pr-summary:
    name: PR Summary
    runs-on: ubuntu-latest
    needs: [
      lint-and-format,
      unit-tests,
      component-tests,
      integration-tests,
      security-checks,
      build-test,
      dependency-check,
      accessibility-check,
      performance-check
    ]
    if: github.event_name == 'pull_request'

    steps:
      - name: Comment PR with results
        uses: actions/github-script@v7
        with:
          script: |
            const results = {
              'Lint & Format': '${{ needs.lint-and-format.result }}',
              'Unit Tests': '${{ needs.unit-tests.result }}',
              'Component Tests': '${{ needs.component-tests.result }}',
              'Integration Tests': '${{ needs.integration-tests.result }}',
              'Security Checks': '${{ needs.security-checks.result }}',
              'Build Test': '${{ needs.build-test.result }}',
              'Dependency Check': '${{ needs.dependency-check.result }}',
              'Accessibility Check': '${{ needs.accessibility-check.result }}',
              'Performance Check': '${{ needs.performance-check.result }}'
            };
            
            const getIcon = (status) => {
              switch(status) {
                case 'success': return '✅';
                case 'failure': return '❌';
                case 'cancelled': return '⏹️';
                default: return '⏳';
              }
            };
            
            const body = \`## 🔍 Quality Checks Summary
            
            \${Object.entries(results).map(([name, status]) => 
              \`\${getIcon(status)} **\${name}**: \${status}\`
            ).join('\\n')}
            
            \${Object.values(results).every(r => r === 'success') ? 
              '🎉 All quality checks passed! This PR is ready for review.' : 
              '⚠️ Some quality checks failed. Please review and fix the issues before merging.'
            }
            
            **Commit**: \${{ github.sha }}
            **Author**: \${{ github.actor }}
            \`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });