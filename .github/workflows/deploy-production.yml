name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests (emergency deployment)'
        required: false
        type: boolean
        default: false

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  NODE_VERSION: '18'

jobs:
  pre-deployment-checks:
    name: Pre-deployment Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if main branch
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "❌ Production deployment is only allowed from main branch"
            exit 1
          fi

      - name: Check for required labels (if PR)
        if: github.event_name == 'pull_request'
        run: |
          echo "Checking PR labels..."
          # Add label checking logic if needed

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check for security vulnerabilities
        run: npm audit --audit-level=high --production

  quality-assurance:
    name: Quality Assurance
    runs-on: ubuntu-latest
    needs: [pre-deployment-checks]
    if: github.event.inputs.skip_tests != 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript check
        run: npm run type-check

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Run component tests with coverage
        run: npm run test:components:coverage

      - name: Run integration tests
        run: npm run test:integration:coverage
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/lcov.info

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: 1

      - name: Bundle analysis
        run: npm run analyze
        env:
          ANALYZE: true

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: [pre-deployment-checks]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        run: npm audit --audit-level=moderate

      - name: Check for known vulnerabilities
        run: |
          # Run additional security checks
          npx audit-ci --config audit-ci.json || true

      - name: CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          languages: javascript

  backup-current-deployment:
    name: Backup Current Deployment
    runs-on: ubuntu-latest
    needs: [quality-assurance, security-audit]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Get current production deployment
        id: current-deployment
        run: |
          CURRENT_URL=$(vercel ls --prod --token=${{ secrets.VERCEL_TOKEN }} | grep "visaassist.ai" | head -1 | awk '{print $2}')
          echo "current_url=$CURRENT_URL" >> $GITHUB_OUTPUT
          echo "Current production URL: $CURRENT_URL"

      - name: Store backup information
        run: |
          mkdir -p backup
          echo "Previous deployment: ${{ steps.current-deployment.outputs.current_url }}" > backup/deployment-info.txt
          echo "Backup created at: $(date)" >> backup/deployment-info.txt
          echo "Commit before deployment: ${{ github.sha }}" >> backup/deployment-info.txt

      - name: Upload backup info
        uses: actions/upload-artifact@v4
        with:
          name: deployment-backup-${{ github.sha }}
          path: backup/

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [quality-assurance, security-audit, backup-current-deployment]
    
    environment:
      name: production
      url: https://visaassist.ai

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          NODE_ENV: production

      - name: Deploy to Vercel
        id: deploy
        run: |
          DEPLOYMENT_URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "deployment_url=$DEPLOYMENT_URL" >> $GITHUB_OUTPUT
          echo "Deployed to: $DEPLOYMENT_URL"

      - name: Wait for deployment propagation
        run: sleep 60

      - name: Production health check
        run: |
          max_attempts=10
          attempt=1
          
          while [ $attempt -le $max_attempts ]; do
            echo "Production health check attempt $attempt/$max_attempts"
            
            if curl -f -s "https://visaassist.ai/api/health" > /dev/null; then
              echo "✅ Production health check passed"
              break
            elif [ $attempt -eq $max_attempts ]; then
              echo "❌ Production health check failed after $max_attempts attempts"
              echo "Initiating automatic rollback..."
              exit 1
            else
              echo "⏳ Health check failed, retrying in 15 seconds..."
              sleep 15
            fi
            
            attempt=$((attempt + 1))
          done

      - name: Test critical user flows
        run: |
          echo "Testing critical production flows..."
          
          # Test homepage
          curl -f -s "https://visaassist.ai" > /dev/null || exit 1
          echo "✅ Homepage accessible"
          
          # Test API endpoints
          curl -f -s "https://visaassist.ai/api/health" > /dev/null || exit 1
          echo "✅ API health check passed"
          
          # Test authentication endpoints
          curl -f -s "https://visaassist.ai/api/auth/session" > /dev/null || exit 1
          echo "✅ Auth endpoints accessible"

      - name: Tag release
        run: |
          VERSION_TAG="v$(date +%Y.%m.%d-%H%M%S)"
          git tag -a "$VERSION_TAG" -m "Production release $VERSION_TAG"
          git push origin "$VERSION_TAG"
          echo "Tagged release: $VERSION_TAG"

  post-deployment-tests:
    name: Post-deployment Tests
    runs-on: ubuntu-latest
    needs: [deploy-production]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run smoke tests
        run: |
          echo "Running production smoke tests..."
          npx playwright test --config=playwright.smoke.config.ts || true
        env:
          PLAYWRIGHT_BASE_URL: https://visaassist.ai

      - name: Performance audit
        uses: treosh/lighthouse-ci-action@v10
        with:
          urls: |
            https://visaassist.ai
            https://visaassist.ai/login
            https://visaassist.ai/dashboard
          configPath: './lighthouserc.js'
          uploadArtifacts: true
          temporaryPublicStorage: true

  rollback-on-failure:
    name: Rollback on Failure
    runs-on: ubuntu-latest
    needs: [deploy-production, post-deployment-tests]
    if: failure()

    steps:
      - name: Download backup info
        uses: actions/download-artifact@v4
        with:
          name: deployment-backup-${{ github.sha }}
          path: backup/

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Get previous deployment URL
        id: previous-deployment
        run: |
          PREVIOUS_URL=$(cat backup/deployment-info.txt | grep "Previous deployment:" | cut -d' ' -f3)
          echo "previous_url=$PREVIOUS_URL" >> $GITHUB_OUTPUT

      - name: Rollback to previous deployment
        run: |
          if [ -n "${{ steps.previous-deployment.outputs.previous_url }}" ]; then
            echo "Rolling back to: ${{ steps.previous-deployment.outputs.previous_url }}"
            vercel alias ${{ steps.previous-deployment.outputs.previous_url }} visaassist.ai --token=${{ secrets.VERCEL_TOKEN }}
            echo "✅ Rollback completed"
          else
            echo "❌ No previous deployment found for rollback"
            exit 1
          fi

      - name: Verify rollback
        run: |
          sleep 30
          curl -f -s "https://visaassist.ai/api/health" > /dev/null || exit 1
          echo "✅ Rollback verification successful"

  notify-deployment:
    name: Notify Deployment
    runs-on: ubuntu-latest
    needs: [deploy-production, post-deployment-tests]
    if: always()

    steps:
      - name: Notify Slack on success
        if: needs.deploy-production.result == 'success' && needs.post-deployment-tests.result == 'success'
        uses: 8398a7/action-slack@v3
        with:
          status: success
          fields: repo,message,commit,author,action,eventName,ref,workflow
          text: |
            🎉 Production deployment successful!
            
            **Environment:** Production
            **URL:** https://visaassist.ai
            **Version:** v$(date +%Y.%m.%d-%H%M%S)
            **Commit:** ${{ github.sha }}
            **Author:** ${{ github.actor }}
            **Duration:** ${{ job.duration }}
            
            ✅ All post-deployment tests passed
            ✅ Performance metrics within thresholds
            ✅ Health checks successful
            
            The new version is now live for all users.
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_PRODUCTION_WEBHOOK }}

      - name: Notify Slack on failure
        if: needs.deploy-production.result == 'failure' || needs.post-deployment-tests.result == 'failure'
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          fields: repo,message,commit,author,action,eventName,ref,workflow
          text: |
            🚨 Production deployment failed!
            
            **Environment:** Production
            **Commit:** ${{ github.sha }}
            **Author:** ${{ github.actor }}
            
            ${{ needs.rollback-on-failure.result == 'success' && '✅ Automatic rollback completed' || '❌ Manual intervention required' }}
            
            Please investigate the failure and take appropriate action.
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_PRODUCTION_WEBHOOK }}

      - name: Notify team via email
        if: needs.deploy-production.result == 'failure'
        run: |
          echo "Production deployment failed. Manual investigation required." | \
          mail -s "🚨 Production Deployment Failure" ops-team@visaassist.ai || true

  cleanup:
    name: Cleanup
    runs-on: ubuntu-latest
    needs: [deploy-production, post-deployment-tests, notify-deployment]
    if: always()

    steps:
      - name: Clean up old deployments
        run: |
          # Keep only the last 10 deployments
          vercel rm --safe --yes --token=${{ secrets.VERCEL_TOKEN }} || true

      - name: Update deployment documentation
        run: |
          echo "Production deployment completed at $(date)" >> DEPLOYMENT_LOG.md
          echo "Commit: ${{ github.sha }}" >> DEPLOYMENT_LOG.md
          echo "Author: ${{ github.actor }}" >> DEPLOYMENT_LOG.md
          echo "---" >> DEPLOYMENT_LOG.md