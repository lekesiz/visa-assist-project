version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: visa-assist-dev
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev
    networks:
      - visa-assist-network

  postgres:
    image: postgres:15-alpine
    container_name: visa-assist-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=visa_assist_dev
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - visa-assist-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: visa-assist-redis-dev
    ports:
      - "6379:6379"
    networks:
      - visa-assist-network

  mailhog:
    image: mailhog/mailhog
    container_name: visa-assist-mailhog
    ports:
      - "1025:1025" # SMTP server
      - "8025:8025" # Web UI
    networks:
      - visa-assist-network

networks:
  visa-assist-network:
    driver: bridge

volumes:
  postgres-data:
  node_modules: